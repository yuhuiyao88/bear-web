name = "bear"
main = "worker/src/index.js"
compatibility_date = "2026-01-15"
workers_dev = true

# The chat page (public/) is served as static assets by the same Worker.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Embeddings for searching the course materials
[ai]
binding = "AI"

# Searchable index of the course materials (filled by the "Build course index" workflow)
[[vectorize]]
binding = "VECTORIZE"
index_name = "bear-index"

# Shared usage counts for the model router (worker/src/models.js lists the models)
[[durable_objects.bindings]]
name = "MODEL_USAGE"
class_name = "ModelUsage"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ModelUsage"]

# Load the BEAR instructions file as plain text
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

[observability]
enabled = true
