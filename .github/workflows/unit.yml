name: Unit tests

on:
  pull_request:
    paths: ["worker/**", "tests/*.mjs", ".github/workflows/unit.yml"]
  push:
    branches: [main]
    paths: ["worker/**", "tests/*.mjs", ".github/workflows/unit.yml"]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/router.test.mjs
