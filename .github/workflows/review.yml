name: Reviewer conversations

on:
  push:
    branches: [main]
    paths: ["ops/review.trigger"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run reviewer conversations
        run: ONLY_FILES="$(cat ops/review.trigger | grep -v '^#' | tr -d '[:space:]')" python -u tests/run_conversations.py 2>&1 | tee ops/last-review.log; exit ${PIPESTATUS[0]}
      - name: Save transcripts to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/review ops/last-review.log || true
          git commit -m "Reviewer transcripts" || exit 0
          git pull --rebase && git push
