name: Deploy BEAR

on:
  push:
    branches: [main]
    paths: ["worker/**", "public/**", "instructions/**", "wrangler.toml", ".github/workflows/deploy.yml", "ops/deploy.trigger"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        run: bash ops/deploy.sh 2>&1 | tee ops/last-deploy.log; exit ${PIPESTATUS[0]}
      - name: Save the log to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/last-deploy.log
          git commit -m "Deploy log" || exit 0
          git pull --rebase && git push
