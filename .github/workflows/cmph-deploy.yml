name: Deploy CMPH prototype
on:
  push:
    branches: [main]
    paths: ['cmph/**', '.github/workflows/cmph-deploy.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cmph-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cmph
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CMPH_ACCESS_CODE: ${{ secrets.CMPH_ACCESS_CODE }}
      CMPH_ADMIN_TOKEN: ${{ secrets.CMPH_ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmph/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check && npm test && npm run build
      - name: Create the separate public-source index if necessary
        run: npx wrangler vectorize get cmph-spark-public || npx wrangler vectorize create cmph-spark-public --dimensions=768 --metric=cosine
      - name: Deploy the separate Worker
        run: npx wrangler deploy
      - name: Configure runtime secrets without exposing values
        run: node scripts/secrets.mjs | npx wrangler secret bulk
      - name: Hosted HTTP checks
        run: node scripts/smoke.mjs
